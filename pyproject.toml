[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-docs-hooks"
version = "0.1.0"
description = "pre-commit hooks that keep agent-facing markdown formatted, linked, indexed and within budget"
requires-python = ">=3.10"
dependencies = [
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "lychee-bin==0.24.2",
    "PyYAML>=6",
    "markdown-it-py>=3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pre-commit==4.6.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_docs_hooks"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
