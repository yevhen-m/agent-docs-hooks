name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest tests/rules -q
      - run: uv run pytest tests/wiring -q
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
